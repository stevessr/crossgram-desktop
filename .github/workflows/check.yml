name: Check upstream releases

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: TypeScript patcher checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn check

  patch:
    name: Patch ${{ matrix.build.target }} / ${{ matrix.build.brand }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - target: tdesktop
            brand: runtime
            repository: telegramdesktop/tdesktop
          - target: tdesktop
            brand: cross
            repository: telegramdesktop/tdesktop
          - target: tdesktop
            brand: qq
            repository: telegramdesktop/tdesktop
          - target: tdesktop
            brand: wechat
            repository: telegramdesktop/tdesktop
          - target: tdesktop
            brand: wecom
            repository: telegramdesktop/tdesktop
          - target: tdesktop
            brand: dingtalk
            repository: telegramdesktop/tdesktop
          - target: tdesktop
            brand: discord
            repository: telegramdesktop/tdesktop
          - target: tdesktop-x64
            brand: runtime
            repository: TDesktop-x64/tdesktop
          - target: tdesktop-x64
            brand: cross
            repository: TDesktop-x64/tdesktop
          - target: tdesktop-x64
            brand: qq
            repository: TDesktop-x64/tdesktop
          - target: tdesktop-x64
            brand: wechat
            repository: TDesktop-x64/tdesktop
          - target: tdesktop-x64
            brand: wecom
            repository: TDesktop-x64/tdesktop
          - target: tdesktop-x64
            brand: dingtalk
            repository: TDesktop-x64/tdesktop
          - target: tdesktop-x64
            brand: discord
            repository: TDesktop-x64/tdesktop
          - target: ayugram
            brand: runtime
            repository: AyuGram/AyuGramDesktop
          - target: ayugram
            brand: cross
            repository: AyuGram/AyuGramDesktop
          - target: ayugram
            brand: qq
            repository: AyuGram/AyuGramDesktop
          - target: ayugram
            brand: wechat
            repository: AyuGram/AyuGramDesktop
          - target: ayugram
            brand: wecom
            repository: AyuGram/AyuGramDesktop
          - target: ayugram
            brand: dingtalk
            repository: AyuGram/AyuGramDesktop
          - target: ayugram
            brand: discord
            repository: AyuGram/AyuGramDesktop
          - target: materialgram
            brand: runtime
            repository: kukuruzka165/materialgram
          - target: materialgram
            brand: cross
            repository: kukuruzka165/materialgram
          - target: materialgram
            brand: qq
            repository: kukuruzka165/materialgram
          - target: materialgram
            brand: wechat
            repository: kukuruzka165/materialgram
          - target: materialgram
            brand: wecom
            repository: kukuruzka165/materialgram
          - target: materialgram
            brand: dingtalk
            repository: kukuruzka165/materialgram
          - target: materialgram
            brand: discord
            repository: kukuruzka165/materialgram
    steps:
      - name: Check out patcher
        uses: actions/checkout@v7
        with:
          path: patcher

      - name: Resolve latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ matrix.build.repository }}
        run: |
          tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out upstream
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.build.repository }}
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1
          submodules: recursive
          path: source

      - name: Check out 64Gram CMake helpers
        if: matrix.build.target == 'tdesktop-x64'
        run: git -C source submodule update --init --depth=1 cmake

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('patcher/yarn.lock') }}

      - name: Install patcher
        working-directory: patcher
        run: yarn install --immutable

      - name: Apply twice and verify
        working-directory: patcher
        env:
          TARGET: ${{ matrix.build.target }}
          BRAND: ${{ matrix.build.brand }}
        run: |
          printf '%s\n' '-----BEGIN RSA PRIVATE KEY-----' 'CHECK' '-----END RSA PRIVATE KEY-----' > "$RUNNER_TEMP/update-key.pem"
          yarn apply --target "$TARGET" --brand "$BRAND" --root "$GITHUB_WORKSPACE/source" \
            --platform linux --build 1 --update-key-file "$RUNNER_TEMP/update-key.pem"
          git -C "$GITHUB_WORKSPACE/source" add --intent-to-add .
          git -C "$GITHUB_WORKSPACE/source" diff --check
          # The updater feature has to leave a real feed and packer behind.
          grep -Fq 'return AutoupdatePrefix("https://raw.githubusercontent.com/crossgram-project/crossgram-desktop/updates/' "$GITHUB_WORKSPACE/source/Telegram/SourceFiles/storage/localstorage.cpp"
          grep -Fq 'CROSSGRAM_BUILD_UPDATE_PACKER' "$GITHUB_WORKSPACE/source/Telegram/CMakeLists.txt"
          grep -Fq 'constexpr auto AppVersion = 100000001;' "$GITHUB_WORKSPACE/source/Telegram/SourceFiles/core/version.h"
          # The packer key header must be written for every packer shape.
          grep -rFq 'CHECK' "$GITHUB_WORKSPACE/source/Telegram/SourceFiles/_other/packer_private.h" \
            || grep -rFq 'CHECK' "$GITHUB_WORKSPACE/DesktopPrivate/packer_private.h"
          before="$(git -C "$GITHUB_WORKSPACE/source" diff --binary --no-ext-diff HEAD | sha256sum)"
          yarn apply --target "$TARGET" --brand "$BRAND" --root "$GITHUB_WORKSPACE/source" \
            --platform linux --build 1 --update-key-file "$RUNNER_TEMP/update-key.pem"
          after="$(git -C "$GITHUB_WORKSPACE/source" diff --binary --no-ext-diff HEAD | sha256sum)"
          test "$before" = "$after"

      - name: Verify in-place brand switching
        if: matrix.build.target == 'tdesktop' && matrix.build.brand == 'cross'
        working-directory: patcher
        run: |
          branding_paths=(
            Telegram/SourceFiles/core/version.h
            Telegram/CMakeLists.txt
            Telegram/Telegram.plist
            Telegram/Resources/winrc
            Telegram/Resources/art
            Telegram/Telegram/Images.xcassets
            Telegram/Resources/qrc/telegram/telegram.qrc
            Telegram/SourceFiles/platform/linux/specific_linux.cpp
            lib/xdg
          )
          for brand in qq discord; do
            git -C "$GITHUB_WORKSPACE/source" checkout -- "${branding_paths[@]}"
            yarn apply --target tdesktop --brand "$brand" --root "$GITHUB_WORKSPACE/source"
            git -C "$GITHUB_WORKSPACE/source" diff --check
            metadata="$(yarn metadata --target tdesktop --brand "$brand")"
            executable="$(jq -r .executable <<<"$metadata")"
            grep -Fq "set(output_name \"$executable\")" "$GITHUB_WORKSPACE/source/Telegram/CMakeLists.txt"
          done
          git -C "$GITHUB_WORKSPACE/source" checkout -- "${branding_paths[@]}"

      - name: Verify 64Gram Windows CBOR symbol isolation
        if: matrix.build.target == 'tdesktop-x64'
        run: |
          cmake_file="$GITHUB_WORKSPACE/source/Telegram/cmake/lib_fido2.cmake"
          grep -Fq 'cbor_encode_uint=crossgram_libcbor_encode_uint' "$cmake_file"
          grep -Fq 'cbor_encode_tag=crossgram_libcbor_encode_tag' "$cmake_file"
          grep -Fq 'cbor_encode_null=crossgram_libcbor_encode_null' "$cmake_file"
          grep -Fq 'cbor_encode_double=crossgram_libcbor_encode_double' "$cmake_file"

      - name: Verify opt-in E2E feature
        if: matrix.build.brand == 'cross' || matrix.build.brand == 'runtime'
        working-directory: patcher
        env:
          TARGET: ${{ matrix.build.target }}
          BRAND: ${{ matrix.build.brand }}
        run: |
          yarn apply --target "$TARGET" --brand "$BRAND" --root "$GITHUB_WORKSPACE/source" \
            --platform linux --build 1 --feature e2e
          git -C "$GITHUB_WORKSPACE/source" add --intent-to-add .
          git -C "$GITHUB_WORKSPACE/source" diff --check
          grep -Fq 'Crossgram::E2e::Start();' "$GITHUB_WORKSPACE/source/Telegram/SourceFiles/core/application.cpp"
          before="$(git -C "$GITHUB_WORKSPACE/source" diff --binary --no-ext-diff HEAD | sha256sum)"
          yarn apply --target "$TARGET" --brand "$BRAND" --root "$GITHUB_WORKSPACE/source" \
            --platform linux --build 1 --feature e2e
          after="$(git -C "$GITHUB_WORKSPACE/source" diff --binary --no-ext-diff HEAD | sha256sum)"
          test "$before" = "$after"
