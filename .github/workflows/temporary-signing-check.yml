name: Temporary updater signing verification

on:
  push:
    branches:
      - fix/linux-updater-rsa1024-signing
  pull_request:
    paths:
      - .github/workflows/release.yml
      - features/updater/**
      - src/cli.ts
      - scripts/ci/prepare-update-key.sh
      - tests/*signing*
      - tests/updater.test.ts
      - tests/linux-build-workflow.test.ts
      - .github/workflows/temporary-signing-check.yml

permissions:
  contents: read

jobs:
  signing:
    name: Signing preflight and TypeScript regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: yarn check
