name: Manual Linux desktop build

on:
  # Also build when this workflow is explicitly updated on main. This allows
  # a one-off build request without changing the normal release schedule.
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-build.yml
  workflow_dispatch:
    inputs:
      target:
        description: Desktop upstream (64Gram currently passes patch compatibility)
        type: choice
        default: tdesktop-x64
        options:
          - tdesktop-x64
          - tdesktop
          - ayugram
          - materialgram
          - all
      brands:
        description: Build brand (runtime = universal; all = six separately uploaded brands)
        type: choice
        default: runtime
        options:
          - runtime
          - all
          - cross
          - qq
          - wechat
          - wecom
          - dingtalk
          - discord

permissions:
  contents: write

jobs:
  desktop:
    uses: ./.github/workflows/release.yml
    with:
      platforms: linux
      target: ${{ inputs.target || 'tdesktop-x64' }}
      brands: ${{ inputs.brands || 'runtime' }}
      build_only: true
    secrets: inherit
