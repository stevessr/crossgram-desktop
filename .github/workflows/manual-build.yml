name: Manual Linux desktop build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop upstream (64Gram currently passes patch compatibility)
        type: choice
        default: tdesktop-x64
        options:
          - tdesktop-x64
          - tdesktop
          - ayugram
          - materialgram
          - all
      brands:
        description: Build brand (runtime = universal package; all = all legacy brands)
        type: choice
        default: runtime
        options:
          - runtime
          - all
          - cross
          - qq
          - wechat
          - wecom
          - dingtalk
          - discord

permissions:
  contents: write

jobs:
  desktop:
    uses: ./.github/workflows/release.yml
    with:
      platforms: linux
      target: ${{ inputs.target }}
      brands: ${{ inputs.brands }}
      build_only: true
    secrets: inherit
