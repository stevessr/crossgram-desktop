name: Build and publish Crossgram Desktop

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: linux
      target:
        type: string
        default: tdesktop-x64
      brands:
        type: string
        default: runtime
      build_only:
        type: boolean
        default: true
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        required: false
        default: all
        type: choice
        options:
          - all
          - windows-linux
          - windows
          - linux
          - macos
      target:
        description: Target to build
        required: false
        default: all
        type: choice
        options:
          - all
          - tdesktop
          - tdesktop-x64
          - ayugram
          - materialgram
      brands:
        description: Runtime universal package (default), or explicit legacy brands
        required: false
        default: runtime
        type: string

permissions:
  contents: write

concurrency:
  group: crossgram-desktop-upstream-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan missing desktop builds
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release-plan.outputs.needed }}
      matrix: ${{ steps.release-plan.outputs.matrix }}
    steps:
      - name: Check out patcher
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install patcher
        run: yarn install --immutable

      - name: Resolve upstreams and build matrix
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLATFORM_FILTER: ${{ inputs.platforms }}
          TARGET_FILTER: ${{ inputs.target }}
          BRAND_FILTER: ${{ inputs.brands }}
        run: yarn tsx scripts/ci/plan-release.ts

  build:
    name: ${{ matrix.build.target }} / ${{ matrix.build.batch }} / ${{ matrix.build.platform }}
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ${{ matrix.build.platform == 'windows' && 'windows-latest' || matrix.build.platform == 'macos' && matrix.build.target == 'materialgram' && 'macos-15' || matrix.build.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out patcher
        uses: actions/checkout@v7
        with:
          path: patcher

      - name: Check out upstream
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.build.repository }}
          ref: ${{ matrix.build.tag }}
          fetch-depth: 1
          submodules: recursive
          path: work/TBuild/source

      - name: Restore native dependency cache
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            work/TBuild/Libraries
            work/TBuild/ThirdParty
          key: native-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build.target }}-${{ hashFiles('work/TBuild/source/Telegram/build/prepare/**') }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('patcher/yarn.lock') }}

      - name: Restore Linux Python caches
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: linux-python-${{ matrix.build.target }}-${{ hashFiles('work/TBuild/source/Telegram/build/docker/centos_env/poetry.lock', 'work/TBuild/source/Telegram/build/docker/centos_env/pyproject.toml') }}

      - name: Expose GitHub cache runtime to Buildx
        if: runner.os == 'Linux'
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Install patcher
        working-directory: patcher
        run: yarn install --immutable

      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: "14.44"
          # Select the Visual Studio installation provided by the runner. A
          # version range ending at 18.9 excludes the refreshed VS 2026 image,
          # while the pinned 14.44 toolset still keeps the compiler stable.

      - name: Build, smoke test, and package Windows brands
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CROSSGRAM_TARGET: ${{ matrix.build.target }}
          BRANDS: ${{ toJSON(matrix.build.brands) }}
          VERSION: ${{ matrix.build.safeTag }}
          UPSTREAM_TAG: ${{ matrix.build.tag }}
          UPSTREAM_REPOSITORY: ${{ matrix.build.repository }}
          BRAND_BATCH: ${{ matrix.build.batch }}
          RUN_NUMBER: ${{ github.run_number }}
          UPDATE_KEY: ${{ secrets.CROSSGRAM_UPDATE_KEY }}
          BUILD_ONLY: ${{ inputs.build_only }}
          OVERRIDE_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          OVERRIDE_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'work/TBuild/source'
          $telegram = Join-Path $source 'Telegram'
          $patcher = Join-Path $env:GITHUB_WORKSPACE 'patcher'
          $brands = @($env:BRANDS | ConvertFrom-Json)
          $brandingPaths = @(
            'Telegram/SourceFiles/core/version.h',
            'Telegram/CMakeLists.txt',
            'Telegram/Telegram.plist',
            'Telegram/Resources/winrc',
            'Telegram/Resources/art',
            'Telegram/Telegram/Images.xcassets',
            'Telegram/Resources/qrc/telegram/telegram.qrc',
            'Telegram/SourceFiles/platform/linux/specific_linux.cpp',
            'lib/xdg'
          )
          function Get-BrandMetadata([string] $brand) {
            Push-Location $patcher
            try {
              $output = @(& yarn metadata --target $env:CROSSGRAM_TARGET --brand $brand)
              if ($LASTEXITCODE -ne 0) { throw "Could not read metadata for $brand" }
              $json = $output | Where-Object { $_ -match '^\{.*\}$' } | Select-Object -Last 1
              if (-not $json) { throw "Metadata for $brand did not contain JSON" }
              return $json | ConvertFrom-Json
            } finally {
              Pop-Location
            }
          }
          function Set-Brand([string] $brand, [bool] $reset) {
            if ($reset) {
              & git -C $source checkout -- $brandingPaths
              if ($LASTEXITCODE -ne 0) { throw "Could not reset branding files" }
            }
            Push-Location $patcher
            try {
              & yarn apply --target $env:CROSSGRAM_TARGET --brand $brand --root $source --platform windows --build $env:RUN_NUMBER --update-key-file $env:CROSSGRAM_UPDATE_KEY_FILE
              if ($LASTEXITCODE -ne 0) { throw "Could not apply brand $brand" }
            } finally {
              Pop-Location
            }
            & git -C $source diff --check
            if ($LASTEXITCODE -ne 0) { throw "Patch validation failed for $brand" }
          }

          $keyFile = Join-Path $env:RUNNER_TEMP 'crossgram-update-key.pem'
          if (-not $env:UPDATE_KEY) { throw 'The CROSSGRAM_UPDATE_KEY secret is required to sign updates' }
          [IO.File]::WriteAllText($keyFile, $env:UPDATE_KEY, [Text.UTF8Encoding]::new($false))
          $env:CROSSGRAM_UPDATE_KEY_FILE = $keyFile

          $firstMetadata = Get-BrandMetadata $brands[0]
          Set-Brand $brands[0] $false
          $atlRoot = Get-ChildItem (Join-Path $env:VCINSTALLDIR 'Tools/MSVC') -Directory |
            ForEach-Object { Join-Path $_.FullName 'atlmfc' } |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ 'include/atlbase.h') } |
            Select-Object -Last 1
          if (-not $atlRoot) { throw 'Could not locate ATL' }
          $env:INCLUDE = "$(Join-Path $atlRoot 'include');$env:INCLUDE"
          $env:LIB = "$(Join-Path $atlRoot 'lib/x64');$env:LIB"
          Push-Location $telegram
          try {
            & .\build\prepare\win.bat silent qt6
            if ($LASTEXITCODE -ne 0) { throw 'Windows dependency preparation failed' }
          } finally {
            Pop-Location
          }

          # FastLink keeps the final link below the hosted runner memory limit
          # while still emitting the standalone PDB shipped in the symbols asset.
          $env:_LINK_ = '/DEBUG:FASTLINK /OPT:REF /OPT:ICF'

          $effectiveId = [string]$firstMetadata.apiId
          $effectiveHash = [string]$firstMetadata.apiHash
          if ($env:OVERRIDE_API_ID -or $env:OVERRIDE_API_HASH) {
            if (-not $env:OVERRIDE_API_ID -or -not $env:OVERRIDE_API_HASH) { throw 'Both API overrides are required' }
            $effectiveId = $env:OVERRIDE_API_ID
            $effectiveHash = $env:OVERRIDE_API_HASH
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          for ($index = 0; $index -lt $brands.Count; $index += 1) {
            $brand = [string]$brands[$index]
            if ($index -gt 0) { Set-Brand $brand $true }
            $metadata = Get-BrandMetadata $brand
            Push-Location $telegram
            try {
              & .\configure.bat qt6 '-GNinja Multi-Config' "-DTDESKTOP_API_ID=$effectiveId" "-DTDESKTOP_API_HASH=$effectiveHash" '-DCMAKE_CONFIGURATION_TYPES=Release' '-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /DQT_NO_DEBUG' '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /DQT_NO_DEBUG' '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' '-DCMAKE_EXE_LINKER_FLAGS=dnsapi.lib' '-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG:FASTLINK /OPT:REF /OPT:ICF' '-DDESKTOP_APP_DISABLE_AUTOUPDATE=OFF' '-DCROSSGRAM_BUILD_UPDATE_PACKER=ON'
              if ($LASTEXITCODE -ne 0) { throw "Configure failed for $brand" }
              & cmake --build ..\out --config Release --parallel
              if ($LASTEXITCODE -ne 0) { throw "Build failed for $brand" }
            } finally {
              Pop-Location
            }

            $output = Join-Path $source 'out/Release'
            $product = Join-Path $output "$($metadata.executable).exe"
            if (-not (Test-Path -LiteralPath $product)) { throw "Missing $product" }
            $workdir = Join-Path $env:RUNNER_TEMP "crossgram-smoke-$brand"
            New-Item -ItemType Directory -Force -Path $workdir | Out-Null
            $process = Start-Process -FilePath $product -ArgumentList '-quit', '-noupdate', '-workdir', $workdir -PassThru
            if (-not $process.WaitForExit(20000)) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            } elseif ($process.ExitCode -ne 0) {
              throw "$product exited with code $($process.ExitCode)"
            }

            $files = @($product)
            $updater = Join-Path $output 'Updater.exe'
            if (Test-Path -LiteralPath $updater) { $files += $updater }
            $archive = "artifacts/crossgram-$env:CROSSGRAM_TARGET-$brand-windows-$env:VERSION.zip"
            $archivePath = [IO.Path]::GetFullPath($archive)
            $packageNames = @($files | ForEach-Object { [IO.Path]::GetFileName($_) })
            & tar.exe -a -cf $archivePath -C $output @packageNames
            if ($LASTEXITCODE -ne 0) { throw "Could not create $archive" }

            $symbolRoot = Join-Path $source 'out'
            $productPdb = Get-ChildItem -LiteralPath $symbolRoot -Filter "$($metadata.executable).pdb" -File -Recurse |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $productPdb) {
              $productPdb = Get-ChildItem -LiteralPath $symbolRoot -Filter '*.pdb' -File -Recurse |
                Where-Object { $_.Name -ne 'Updater.pdb' } |
                Sort-Object LastWriteTimeUtc -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $productPdb) { throw "Missing external symbols for $product" }
            $symbolFiles = @($productPdb)
            $updaterPdb = Get-ChildItem -LiteralPath $symbolRoot -Filter 'Updater.pdb' -File -Recurse |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if ($updaterPdb) { $symbolFiles += $updaterPdb }
            $symbolsStage = Join-Path $env:RUNNER_TEMP "crossgram-symbols-$brand"
            if (Test-Path -LiteralPath $symbolsStage) {
              Remove-Item -LiteralPath $symbolsStage -Recurse -Force
            }
            New-Item -ItemType Directory -Path $symbolsStage | Out-Null
            foreach ($symbolFile in $symbolFiles) {
              Copy-Item -LiteralPath $symbolFile -Destination $symbolsStage
            }
            $symbolsArchive = "artifacts/crossgram-$env:CROSSGRAM_TARGET-$brand-windows-$env:VERSION.symbols.zip"
            $symbolsArchivePath = [IO.Path]::GetFullPath($symbolsArchive)
            $symbolNames = @($symbolFiles | ForEach-Object { [IO.Path]::GetFileName($_) })
            & tar.exe -a -cf $symbolsArchivePath -C $symbolsStage @symbolNames
            if ($LASTEXITCODE -ne 0) { throw "Could not create $symbolsArchive" }

            # Pack the signed update payload that the client downloads and installs.
            $crossgramVersion = 100000000 + [int]$env:RUN_NUMBER
            $packer = Join-Path $output 'Packer.exe'
            if (-not (Test-Path -LiteralPath $packer)) { throw 'Missing Packer.exe' }
            $payloadStage = Join-Path $env:RUNNER_TEMP "crossgram-payload-$brand"
            if (Test-Path -LiteralPath $payloadStage) {
              Remove-Item -LiteralPath $payloadStage -Recurse -Force
            }
            New-Item -ItemType Directory -Path $payloadStage | Out-Null
            foreach ($file in $files) { Copy-Item -LiteralPath $file -Destination $payloadStage }
            $payloadWork = Join-Path $env:RUNNER_TEMP "crossgram-payload-work-$brand"
            if (Test-Path -LiteralPath $payloadWork) {
              Remove-Item -LiteralPath $payloadWork -Recurse -Force
            }
            New-Item -ItemType Directory -Path $payloadWork | Out-Null
            Push-Location $payloadWork
            try {
              & $packer -path $payloadStage -version $crossgramVersion -target win64
              if ($LASTEXITCODE -ne 0) { throw "Packing the update failed for $brand" }
            } finally {
              Pop-Location
            }
            $payloadName = "crossgram-$env:CROSSGRAM_TARGET-$brand-windows-$crossgramVersion.upd"
            $payloadSource = Join-Path $payloadWork "tx64upd$crossgramVersion"
            if (-not (Test-Path -LiteralPath $payloadSource)) { throw "Missing $payloadSource" }
            Move-Item -LiteralPath $payloadSource -Destination ([IO.Path]::GetFullPath((Join-Path 'artifacts' $payloadName)))
          }
          $releaseMetadata = [ordered]@{
            target = $env:CROSSGRAM_TARGET
            repository = $env:UPSTREAM_REPOSITORY
            tag = $env:UPSTREAM_TAG
          } | ConvertTo-Json -Compress
          $metadataFile = "artifacts/crossgram-$env:CROSSGRAM_TARGET-$env:BRAND_BATCH-windows-$env:VERSION.upstream.json"
          [IO.File]::WriteAllText($metadataFile, "$releaseMetadata`n", [Text.UTF8Encoding]::new($false))

      - name: Build, smoke test, and package Linux brands
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.build.target }}
          BRANDS: ${{ toJSON(matrix.build.brands) }}
          VERSION: ${{ matrix.build.safeTag }}
          UPSTREAM_TAG: ${{ matrix.build.tag }}
          UPSTREAM_REPOSITORY: ${{ matrix.build.repository }}
          BRAND_BATCH: ${{ matrix.build.batch }}
          RUN_NUMBER: ${{ github.run_number }}
          UPDATE_KEY: ${{ secrets.CROSSGRAM_UPDATE_KEY }}
          BUILD_ONLY: ${{ inputs.build_only }}
          OVERRIDE_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          OVERRIDE_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          source="$GITHUB_WORKSPACE/work/TBuild/source"
          patcher="$GITHUB_WORKSPACE/patcher"
          brands=()
          while IFS= read -r brand; do brands+=("$brand"); done < <(jq -r '.[]' <<<"$BRANDS")
          branding_paths=(
            Telegram/SourceFiles/core/version.h
            Telegram/CMakeLists.txt
            Telegram/Telegram.plist
            Telegram/Resources/winrc
            Telegram/Resources/art
            Telegram/Telegram/Images.xcassets
            Telegram/Resources/qrc/telegram/telegram.qrc
            Telegram/SourceFiles/platform/linux/specific_linux.cpp
            lib/xdg
          )
          apply_brand() {
            local brand="$1"
            local reset="$2"
            if [ "$reset" = true ]; then
              git -C "$source" checkout -- "${branding_paths[@]}"
            fi
            (cd "$patcher" && yarn apply --target "$TARGET" --brand "$brand" --root "$source" \
              --platform linux --build "$RUN_NUMBER" --update-key-file "$UPDATE_KEY_FILE")
            git -C "$source" diff --check
          }
          metadata_for() {
            local output json
            output="$(cd "$patcher" && yarn metadata --target "$TARGET" --brand "$1")"
            json="$(awk '/^\{.*\}$/ { value=$0 } END { print value }' <<<"$output")"
            if [ -z "$json" ]; then
              echo "Metadata for $1 did not contain JSON" >&2
              return 1
            fi
            jq -e . >/dev/null <<<"$json"
            printf '%s\n' "$json"
          }

          UPDATE_KEY_FILE="$RUNNER_TEMP/crossgram-update-key.pem"
          if [ -z "$UPDATE_KEY" ]; then
            if [ "$BUILD_ONLY" != true ]; then
              echo "The CROSSGRAM_UPDATE_KEY secret is required to sign updates" >&2
              exit 1
            fi
            # Isolated manual builds do not publish or share a release signing key.
            openssl genrsa -out "$UPDATE_KEY_FILE" 2048
            chmod 600 "$UPDATE_KEY_FILE"
            echo "Build-only artifact uses an ephemeral update key; not for production updates." >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s' "$UPDATE_KEY" > "$UPDATE_KEY_FILE"
          fi

          first_metadata="$(metadata_for "${brands[0]}")"
          apply_brand "${brands[0]}" false
          cppgir_cmake="$source/cmake/external/glib/cppgir/CMakeLists.txt"
          if grep -q 'set(GI_IGNORE_FILE_INSTALL_DIR ${CMAKE_INSTALL_FULL_DATADIR}/${PROJECT_NAME})' "$cppgir_cmake"; then
            sed -i 's|${CMAKE_INSTALL_FULL_DATADIR}/${PROJECT_NAME}|${CMAKE_INSTALL_DATADIR}/${PROJECT_NAME}|' "$cppgir_cmake"
          fi
          cd "$source/Telegram/build/docker/centos_env"
          python3 -m pip install --user poetry
          poetry install
          generated="$(DEBUG= LTO= poetry run gen_dockerfile)"
          printf '%s\n' "$generated" > Dockerfile
          python3 - <<'PY'
          import re
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text()
          upstream = "https://github.com/xiph/rnnoise.git"
          replacement = "https://github.com/desktop-app/rnnoise.git"
          if upstream not in text:
              raise SystemExit("generated Dockerfile does not contain the expected rnnoise source")
          stage_start = 0
          while True:
              stage_start = text.find("\nFROM builder AS ", stage_start)
              if stage_start < 0:
                  break
              stage_name_start = stage_start + len("\nFROM builder AS ")
              stage_name_end = text.find("\n", stage_name_start)
              stage_name = text[stage_name_start:stage_name_end]
              next_stage = text.find("\nFROM ", stage_name_end)
              if next_stage < 0:
                  next_stage = len(text)
              stage_text = text[stage_start:next_stage]
              stage_text = stage_text.replace(
                  "target=/var/cache/ccache",
                  f"target=/var/cache/ccache-{stage_name}",
                  1,
              )
              stage_text = stage_text.replace("ccache gcc", "gcc").replace("ccache g++", "g++")
              if stage_name == "qt":
                  stage_text = stage_text.replace(
                      "cmake --build build --parallel 1",
                      "cmake --build build --parallel 2",
                      1,
                  )
              if stage_name == "protobuf":
                  stage_text = stage_text.replace(
                      "cmake --build build --parallel 1",
                      "cmake --build build --parallel 2",
                      1,
                  )
              if stage_name in {"dav1d", "xkbcommon", "protobuf", "jxl", "openal", "openh264", "ffmpeg", "qt"}:
                  stage_text = stage_text.replace(
                      "<<EOF\n",
                      "<<EOF\nexport CFLAGS=\"$CFLAGS -O0\"\nexport CXXFLAGS=\"$CXXFLAGS -O0\"\n",
                      1,
                  )
              if stage_name == "openssl":
                  stage_text = stage_text.replace(
                      "./config --openssldir=/etc/ssl no-shared no-tests no-dso",
                      "./config --openssldir=/etc/ssl no-shared no-tests no-dso no-asm",
                      1,
                  )
                  stage_text = stage_text.replace(
                      "cd openssl\n",
                      "cd openssl\nexport CC=/usr/bin/clang\nexport CXX=/usr/bin/clang++\nexport CFLAGS=\"${CFLAGS//-fhardened/}\"\nexport CFLAGS=\"${CFLAGS//-Wno-hardened/}\"\nexport CFLAGS=\"${CFLAGS//-flto=auto/}\"\nexport CFLAGS=\"${CFLAGS//-ffat-lto-objects/}\"\nexport CFLAGS=\"${CFLAGS//-O3/-O1}\"\nexport CXXFLAGS=\"$CFLAGS\"\n",
                      1,
                  )
                  stage_text = stage_text.replace("make -j$(nproc)", "make -j4", 1)
              if stage_name == "xkbcommon":
                  run_start = stage_text.find("RUN ")
                  heredoc_start = stage_text.find("<<EOF\n", run_start)
                  run_end = stage_text.find("\nEOF", heredoc_start)
                  if run_start < 0 or heredoc_start < 0 or run_end < 0:
                      raise SystemExit("generated Dockerfile does not contain the xkbcommon build step")
                  run_prefix = stage_text[run_start:heredoc_start + len("<<EOF\n")]
                  stage_text = (
                      stage_text[:run_start]
                      + run_prefix
                      + "mkdir -p /usr/src/xkbcommon-cache/usr/local/include/xkbcommon /usr/src/xkbcommon-cache/usr/local/lib64\n"
                      + "cp -a /usr/include/xkbcommon/. /usr/src/xkbcommon-cache/usr/local/include/xkbcommon/\n"
                      + "cp -a /usr/lib64/libxkbcommon.so* /usr/src/xkbcommon-cache/usr/local/lib64/\nEOF"
                      + stage_text[run_end + len("\nEOF"):]
                  )
              text = text[:stage_start] + stage_text + text[next_stage:]
              stage_start = stage_start + len(stage_text)
          text = text.replace(
              "git clone -b xcb-util-image-0.4.1-gitlab --depth=1 --recursive --shallow-submodules \\\n\thttps://github.com/gitlab-freedesktop-mirrors/libxcb-image.git\ncd libxcb-image",
              "git clone -b xcb-util-image-0.4.1-gitlab --depth=1 https://github.com/gitlab-freedesktop-mirrors/libxcb-image.git\ncd libxcb-image\ngit -c url.\"https://github.com/GlassOnTin/xcb-util-m4.git\".insteadOf=\"https://gitlab.freedesktop.org/xorg/util/xcb-util-m4.git\" submodule update --init --depth=1",
              1,
          )
          text = text.replace(
              "find $PWD/../patches/qtwayland_$QT -type f -print0 | sort -z | xargs -r0 git -C qtwayland apply\ncmake -B build .",
              "find $PWD/../patches/qtwayland_$QT -type f -print0 | sort -z | xargs -r0 git -C qtwayland apply\nsed -i '/    using namespace QNativeInterface;/i#if QT_CONFIG(xcb)' qtwayland/src/compositor/compositor_api/qwaylandkeyboard.cpp\nsed -i '/    return mXkbState.get();/i#endif' qtwayland/src/compositor/compositor_api/qwaylandkeyboard.cpp\ngrep -qx '#if QT_CONFIG(xcb)' qtwayland/src/compositor/compositor_api/qwaylandkeyboard.cpp\ncmake -B build .",
              1,
          )
          text = text.replace("gperf flex bison clang-tools-extra", "gperf flex bison clang clang-tools-extra openssl-devel libxkbcommon-devel", 1)
          text = text.replace("ccache gcc", "gcc").replace("ccache g++", "g++")
          text = text.replace("<<EOF\n", "<<EOF\nexport CCACHE_DISABLE=1\n")
          text = text.replace(
              "COPY --link --from=boost /usr/src/boost-cache /\n",
              "COPY --link --from=boost /usr/src/boost-cache.tar /usr/src/boost-cache.tar\nRUN tar -C / -xzf /usr/src/boost-cache.tar && rm /usr/src/boost-cache.tar\n",
          )
          final_stage = text.rfind("\nFROM builder\n")
          if final_stage < 0:
              raise SystemExit("generated Dockerfile does not contain the final builder stage")
          text = text[:final_stage] + text[final_stage:].replace("COPY --link ", "COPY ")
          text = text.replace("-j$(nproc)", "-j2")
          text = text.replace("-j2 install", "-j4 install")
          text = text.replace("meson compile -C build", "meson compile -C build -j2")
          text = text.replace(
              "CFLAGS=\"$CFLAGS -fno-lto\" CXXFLAGS=\"$CXXFLAGS -fno-lto\" ./configure\nmake -j2",
              "sed -i '8220,8525d;5271,5277d;2726,2763d;1402,1432d;335d;238d' Makefile.in\nCFLAGS=\"$CFLAGS -fno-lto\" CXXFLAGS=\"$CXXFLAGS -fno-lto\" ./configure\nmake -j2",
          )
          text = text.replace("make DESTDIR=/usr/src/breakpad-cache install", "make -j2 DESTDIR=/usr/src/breakpad-cache install")
          text = text.replace(
              "./b2 release link=static cflags=\"$CFLAGS\" cxxflags=\"$CXXFLAGS\" linkflags=\"$LDFLAGS\" -j4 install\ncd ..",
              "./b2 release link=static cflags=\"$CFLAGS\" cxxflags=\"$CXXFLAGS\" linkflags=\"$LDFLAGS\" -j4 stage\nmkdir -p /usr/src/boost-cache/usr/local/include /usr/src/boost-cache/usr/local/lib\ncp -a boost /usr/src/boost-cache/usr/local/include/\ncp -a stage/lib/. /usr/src/boost-cache/usr/local/lib/\ntar -C /usr/src/boost-cache -czf /usr/src/boost-cache.tar usr\ncd ..",
          )
          text = text.replace("cmake --build build", "cmake --build build --parallel 1")
          text = text.replace(
              "./config --openssldir=/etc/ssl no-shared no-tests no-dso\nmake -j2",
              "./config --openssldir=/etc/ssl no-shared no-tests no-dso no-asm\nmake -j4",
          )
          text = text.replace(
              "cmake -B build . -DTG_OWT_DLOPEN_PIPEWIRE=ON\ncmake --build build --parallel 1",
              "export CFLAGS=\"$CFLAGS -O0\" CXXFLAGS=\"$CXXFLAGS -O0\"\ncmake -B build . -DTG_OWT_DLOPEN_PIPEWIRE=ON\ncmake --build build --parallel 1",
          )
          dockerfile.write_text(text.replace("git clone -b v0.2 --depth=1 " + upstream, "git clone --depth=1 " + replacement))
          PY
          cat > "$RUNNER_TEMP/buildkitd.toml" <<'EOF'
          [worker.oci]
            max-parallelism = 2
          EOF
          docker buildx create --name crossgram-buildkit --driver docker-container --buildkitd-config "$RUNNER_TEMP/buildkitd.toml" --use
          docker buildx build \
            --builder crossgram-buildkit \
            --cache-from "type=gha,scope=crossgram-linux-deps-$TARGET,timeout=10m" \
            --cache-to "type=gha,scope=crossgram-linux-deps-$TARGET,mode=min,ignore-error=true,timeout=30m" \
            --load \
            -t crossgram-tdesktop-build \
            .
          # xvfb is part of the GitHub-hosted Ubuntu image. Avoid an apt update
          # here: a stalled mirror would otherwise consume the remaining
          # six-hour job budget after the dependency image has finished.
          command -v xvfb-run >/dev/null
          command -v Xvfb >/dev/null

          effective_id="$(jq -r .apiId <<<"$first_metadata")"
          effective_hash="$(jq -r .apiHash <<<"$first_metadata")"
          if [ -n "$OVERRIDE_API_ID$OVERRIDE_API_HASH" ]; then
            test -n "$OVERRIDE_API_ID" && test -n "$OVERRIDE_API_HASH"
            effective_id="$OVERRIDE_API_ID"
            effective_hash="$OVERRIDE_API_HASH"
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          release_optimization=-O3
          if [ "$TARGET" = ayugram ]; then
            # AyuGram's Linux translation units repeatedly exceed the hosted
            # runner's six-hour job limit even at -O2. -O1 keeps an optimized
            # release build while leaving enough time for linking and packaging.
            release_optimization=-O1
          fi
          for index in "${!brands[@]}"; do
            brand="${brands[$index]}"
            if [ "$index" -gt 0 ]; then apply_brand "$brand" true; fi
            metadata="$(metadata_for "$brand")"
            product="$(jq -r .executable <<<"$metadata")"
            cd "$source"
            # The packer include escapes the source checkout into its sibling.
            # Keep signing headers out of the image/cache and mount them read-only.
            private_dir="$(dirname "$source")/DesktopPrivate"
            mkdir -p "$private_dir"
            if grep -Fq '../../../../DesktopPrivate/packer_private.h' Telegram/SourceFiles/_other/packer.cpp; then
              test -s "$private_dir/packer_private.h"
            fi
            if grep -Fq '../../../../DesktopPrivate/alpha_private.h' Telegram/SourceFiles/_other/packer.cpp; then
              test -s "$private_dir/alpha_private.h"
            fi
            docker run --rm \
              -u "$(id -u)" \
              -w /usr/src/tdesktop \
              -v "$PWD:/usr/src/tdesktop" \
              -v "$private_dir:/usr/src/DesktopPrivate:ro" \
              -e CONFIG=Release \
              crossgram-tdesktop-build \
              /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -Wno-error=policy \
              -Wno-error=install-absolute-destination \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D "CMAKE_C_FLAGS_RELEASE=$release_optimization -DNDEBUG -DQT_NO_DEBUG" \
              -D "CMAKE_CXX_FLAGS_RELEASE=$release_optimization -DNDEBUG -DQT_NO_DEBUG" \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
              -D CROSSGRAM_BUILD_UPDATE_PACKER=ON \
              -D "TDESKTOP_API_ID=$effective_id" \
              -D "TDESKTOP_API_HASH=$effective_hash"

            binary="$source/out/Release/$product"
            test -x "$binary"
            if readelf --dynamic "$binary" | grep -Eq 'Shared library: \[lib(ssl|crypto)\.so'; then
              echo "$binary unexpectedly depends on shared OpenSSL libraries" >&2
              exit 1
            fi
            # This Qt build intentionally ships only Wayland platform plugins,
            # while GitHub's Linux runner exposes an Xvfb/X11 display. Starting
            # the GUI there aborts before application code runs, so validate
            # that the executable loader can resolve every runtime dependency
            # instead of requiring an incompatible display server.
            dependency_report="$(ldd "$binary")"
            printf '%s\n' "$dependency_report"
            if grep -Fq 'not found' <<<"$dependency_report"; then
              echo "$binary has missing shared runtime dependencies" >&2
              exit 1
            fi

            symbols="$GITHUB_WORKSPACE/artifacts/symbols-$brand"
            rm -rf "$symbols"
            mkdir -p "$symbols"
            objcopy --only-keep-debug "$binary" "$symbols/$product.debug"
            strip --strip-all "$binary"
            if readelf --sections "$binary" | grep -Eq '\.debug_|\.symtab'; then
              echo "Unstripped debug or symbol sections remain in $binary" >&2
              exit 1
            fi
            updater="$source/out/Release/Updater"
            if [ -f "$updater" ]; then
              objcopy --only-keep-debug "$updater" "$symbols/Updater.debug"
              strip --strip-all "$updater"
            fi

            package="$GITHUB_WORKSPACE/artifacts/package"
            rm -rf "$package"
            mkdir -p "$package"
            cp "$binary" "$package/"
            test ! -f "$updater" || cp "$updater" "$package/"
            archive="$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-linux-$VERSION.tar.xz"
            tar -C "$package" -cJf "$archive" .

            # Pack the signed update payload that the client downloads and installs.
            crossgram_version=$((100000000 + RUN_NUMBER))
            payload_work="$GITHUB_WORKSPACE/artifacts/payload-work-$brand"
            rm -rf "$payload_work"
            mkdir -p "$payload_work"
            docker run --rm \
              -u "$(id -u)" \
              -w /work \
              -v "$GITHUB_WORKSPACE:/work" \
              -v "$source:/usr/src/tdesktop" \
              crossgram-tdesktop-build \
              "/usr/src/tdesktop/out/Release/Packer" \
              -path "/work/artifacts/package" \
              -version "$crossgram_version"
            payload_source="$payload_work/tlinuxupd$crossgram_version"
            if [ ! -f "$payload_source" ]; then
              echo "Missing $payload_source" >&2
              exit 1
            fi
            mv "$payload_source" "$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-linux-$crossgram_version.upd"
            symbols_archive="$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-linux-$VERSION.symbols.tar.xz"
            tar -C "$symbols" -cJf "$symbols_archive" .
          done
          jq -cn \
            --arg target "$TARGET" \
            --arg repository "$UPSTREAM_REPOSITORY" \
            --arg tag "$UPSTREAM_TAG" \
            '{ target: $target, repository: $repository, tag: $tag }' \
            > "$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$BRAND_BATCH-linux-$VERSION.upstream.json"

      - name: Build, smoke test, and package macOS brands
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.build.target }}
          BRANDS: ${{ toJSON(matrix.build.brands) }}
          VERSION: ${{ matrix.build.safeTag }}
          UPSTREAM_TAG: ${{ matrix.build.tag }}
          UPSTREAM_REPOSITORY: ${{ matrix.build.repository }}
          BRAND_BATCH: ${{ matrix.build.batch }}
          OVERRIDE_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          OVERRIDE_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          source="$GITHUB_WORKSPACE/work/TBuild/source"
          patcher="$GITHUB_WORKSPACE/patcher"
          brands=()
          while IFS= read -r brand; do brands+=("$brand"); done < <(jq -r '.[]' <<<"$BRANDS")
          branding_paths=(
            Telegram/SourceFiles/core/version.h
            Telegram/CMakeLists.txt
            Telegram/Telegram.plist
            Telegram/Resources/winrc
            Telegram/Resources/art
            Telegram/Telegram/Images.xcassets
            Telegram/Resources/qrc/telegram/telegram.qrc
            Telegram/SourceFiles/platform/linux/specific_linux.cpp
            lib/xdg
          )
          apply_brand() {
            local brand="$1"
            local reset="$2"
            if [ "$reset" = true ]; then
              git -C "$source" checkout -- "${branding_paths[@]}"
            fi
            (cd "$patcher" && yarn apply --target "$TARGET" --brand "$brand" --root "$source")
            git -C "$source" diff --check
          }
          metadata_for() {
            local output json
            output="$(cd "$patcher" && yarn metadata --target "$TARGET" --brand "$1")"
            json="$(awk '/^\{.*\}$/ { value=$0 } END { print value }' <<<"$output")"
            if [ -z "$json" ]; then
              echo "Metadata for $1 did not contain JSON" >&2
              return 1
            fi
            jq -e . >/dev/null <<<"$json"
            printf '%s\n' "$json"
          }

          first_metadata="$(metadata_for "${brands[0]}")"
          apply_brand "${brands[0]}" false
          brew install automake libtool meson nasm ninja pkg-config
          export CMAKE_BUILD_PARALLEL_LEVEL=3 MAKEFLAGS=-j3
          build_parallel=(--parallel 3)
          if [ "$TARGET" = materialgram ] && [ "$(uname -m)" = arm64 ]; then
            sudo softwareupdate --install-rosetta --agree-to-license
            selected_xcode="$(cd "$(xcode-select -p)/../.." && pwd -P)"
            for xcode in /Applications/Xcode*.app; do
              [ -d "$xcode" ] || continue
              candidate="$(cd "$xcode" && pwd -P)"
              if [ "$candidate" != "$selected_xcode" ]; then
                echo "Removing unused $candidate"
                sudo rm -rf "$candidate"
              fi
            done
            simulator_runtimes=/Library/Developer/CoreSimulator/Profiles/Runtimes
            if [ -d "$simulator_runtimes" ]; then
              sudo rm -rf "$simulator_runtimes"
            fi
            brew cleanup --prune=all
            df -h /
            sed -i '' \
              "s/'MAKE_THREADS_CNT': '-j' + str(os.cpu_count())/'MAKE_THREADS_CNT': '-j3'/" \
              "$source/Telegram/build/prepare/prepare.py"
          fi
          effective_id="$(jq -r .apiId <<<"$first_metadata")"
          effective_hash="$(jq -r .apiHash <<<"$first_metadata")"
          if [ -n "$OVERRIDE_API_ID$OVERRIDE_API_HASH" ]; then
            test -n "$OVERRIDE_API_ID" && test -n "$OVERRIDE_API_HASH"
            effective_id="$OVERRIDE_API_ID"
            effective_hash="$OVERRIDE_API_HASH"
          fi
          cd "$GITHUB_WORKSPACE/work/TBuild"
          prepare_log="$RUNNER_TEMP/$TARGET-prepare.log"
          for attempt in 1 2 3; do
            : >"$prepare_log"
            if ./source/Telegram/build/prepare/mac.sh silent >"$prepare_log" 2>&1; then
              if [ "$TARGET" != materialgram ]; then cat "$prepare_log"; fi
              break
            fi
            tail -n 250 "$prepare_log"
            if [ "$attempt" -eq 3 ] || ! grep -Eqi \
              'Could not resolve host|Failed to connect|Connection reset|RPC failed|early EOF|remote end hung up unexpectedly|HTTP (5[0-9]{2}|429)' \
              "$prepare_log"; then
              exit 1
            fi
            echo "Transient dependency download failure; retrying macOS preparation ($attempt/3)."
            sleep $((attempt * 20))
          done
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          configure_args=()
          if [ "$TARGET" = materialgram ]; then
            configure_args+=(
              '-GNinja Multi-Config'
              '-D' 'CMAKE_OSX_ARCHITECTURES=x86_64'
              '-D' 'DESKTOP_APP_DISABLE_SWIFT6=ON'
            )
          fi
          for index in "${!brands[@]}"; do
            brand="${brands[$index]}"
            if [ "$index" -gt 0 ]; then apply_brand "$brand" true; fi
            metadata="$(metadata_for "$brand")"
            executable="$(jq -r .executable <<<"$metadata")"
            cd "$source/Telegram"
            ./configure.sh "${configure_args[@]}" \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D "CMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -DQT_NO_DEBUG" \
              -D "CMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -DQT_NO_DEBUG" \
              -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D "TDESKTOP_API_ID=$effective_id" \
              -D "TDESKTOP_API_HASH=$effective_hash"
            if [ "$TARGET" = materialgram ]; then
              build_log="$RUNNER_TEMP/materialgram-build.log"
              if ! cmake --build ../out --config Release "${build_parallel[@]}" >"$build_log" 2>&1; then
                wc -c "$build_log"
                tail -c 131072 "$build_log" | fold -w 2000
                df -h /
                exit 1
              fi
            else
              cmake --build ../out --config Release "${build_parallel[@]}"
            fi

            app="$source/out/Release/$executable.app"
            product="$app/Contents/MacOS/$executable"
            test -x "$product"
            workdir="$(mktemp -d)"
            "$product" -quit -noupdate -workdir "$workdir" &
            pid=$!
            exited=false
            for _ in {1..20}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"
                exited=true
                break
              fi
              sleep 1
            done
            rm -rf "$workdir"
            if [ "$exited" != true ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi

            symbols="$GITHUB_WORKSPACE/artifacts/symbols-$brand"
            rm -rf "$symbols"
            mkdir -p "$symbols"
            generated_dsym="$source/out/Release/$executable.app.dSYM"
            if [ -d "$generated_dsym" ]; then
              cp -R "$generated_dsym" "$symbols/"
            else
              dsymutil "$product" -o "$symbols/$executable.dSYM"
            fi
            strip -S -x "$product"

            archive="$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-macos-$VERSION.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
            symbols_archive="$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-macos-$VERSION.symbols.zip"
            ditto -c -k --sequesterRsrc "$symbols" "$symbols_archive"
          done
          jq -cn \
            --arg target "$TARGET" \
            --arg repository "$UPSTREAM_REPOSITORY" \
            --arg tag "$UPSTREAM_TAG" \
            '{ target: $target, repository: $repository, tag: $tag }' \
            > "$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$BRAND_BATCH-macos-$VERSION.upstream.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crossgram-${{ matrix.build.target }}-${{ matrix.build.batch }}--${{ matrix.build.platform }}--${{ matrix.build.safeTag }}
          path: artifacts/crossgram-*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish one unified release
    if: >-
      always() &&
      !inputs.build_only &&
      needs.plan.outputs.needed == 'true' &&
      (github.event_name == 'schedule' ||
       (inputs.platforms == 'all' &&
        inputs.target == 'all' &&
        (inputs.brands == 'runtime' || inputs.brands == 'all')))
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out patcher
        uses: actions/checkout@v7
        with:
          path: patcher

      - name: Download successful platform builds
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: crossgram-*
          path: artifacts
          merge-multiple: true

      - name: Publish all successful targets, brands, and platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -d artifacts ]; then
            echo "No successful artifacts; skipping release."
            exit 0
          fi
          mapfile -t metadata < <(find artifacts -maxdepth 1 -type f -name '*.upstream.json' -print | sort)
          if [ "${#metadata[@]}" -eq 0 ]; then
            echo "No release metadata was downloaded; skipping release."
            exit 0
          fi
          if jq -s -e 'group_by(.target) | any(.[]; (map(.tag) | unique | length) != 1 or (map(.repository) | unique | length) != 1)' "${metadata[@]}" >/dev/null; then
            echo "Conflicting upstream metadata for the same target." >&2
            exit 1
          fi
          files=()
          while IFS= read -r package; do
            case "$package" in
              *.symbols.zip|*.symbols.tar.xz) continue ;;
              *.zip) symbols="${package%.zip}.symbols.zip" ;;
              *.tar.xz) symbols="${package%.tar.xz}.symbols.tar.xz" ;;
              *) continue ;;
            esac
            if [ -f "$symbols" ]; then
              files+=("$package" "$symbols")
            else
              echo "Skipping incomplete package without matching symbols: $package" >&2
            fi
          done < <(find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.xz' \) -print | sort)
          while IFS= read -r payload; do
            files+=("$payload")
          done < <(find artifacts -maxdepth 1 -type f -name '*.upd' -print | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No complete package and symbol pairs; skipping release."
            exit 0
          fi

          release_tag="crossgram-${GITHUB_RUN_NUMBER}"
          release_name="Crossgram Desktop #${GITHUB_RUN_NUMBER}"
          {
            echo "Unified Crossgram Desktop build from workflow run ${GITHUB_RUN_NUMBER}."
            echo
            echo "Included upstream revisions:"
            jq -s -r 'unique_by(.target) | sort_by(.target)[] | "- \(.target): `\(.tag)` from \(.repository)"' "${metadata[@]}"
            echo
            echo "All successful upstream, platform, standard, and branded builds are attached to this one release. User packages contain stripped production binaries built with NDEBUG and QT_NO_DEBUG. Matching Windows PDB, Linux debug files, and macOS dSYM bundles are published separately as *.symbols.* assets."
            echo
            echo "Themed builds are unofficial and are not affiliated with or endorsed by the owner of the referenced application name or icon."
          } > release-notes.md

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${files[@]}" --clobber
          else
            gh release create "$release_tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$release_name" \
              --notes-file release-notes.md
          fi

      - name: Publish the Crossgram update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mapfile -t payloads < <(find artifacts -maxdepth 1 -type f -name '*.upd' -print | sort)
          if [ "${#payloads[@]}" -eq 0 ]; then
            echo "No update payloads were produced; skipping the feed."
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess, tempfile

          repository = os.environ["GH_REPO"]
          run = os.environ["RUN_NUMBER"]
          tag = "crossgram-" + run
          public_key = pathlib.Path("patcher/features/updater/assets/update-public-key.pem")
          pattern = re.compile(
              r"^crossgram-(?P<target>.+)-(?P<brand>runtime|cross|qq|wechat|wecom|dingtalk|discord)"
              r"-(?P<platform>windows|linux|macos)-(?P<version>\d+)\.upd$"
          )
          versions = ["current", "current2", "current3", "current6"]
          written = 0
          with tempfile.TemporaryDirectory() as scratch:
              for payload in sorted(pathlib.Path("artifacts").glob("*.upd")):
                  match = pattern.match(payload.name)
                  if not match:
                      raise SystemExit(f"unexpected payload name: {payload.name}")
                  blob = payload.read_bytes()
                  if len(blob) <= 148:
                      raise SystemExit(f"payload {payload.name} is too small to carry a header")
                  signature, digest, body = blob[:128], blob[128:148], blob[148:]
                  if hashlib.sha1(body).digest() != digest:
                      raise SystemExit(f"payload {payload.name} has a broken SHA1 header")
                  signature_file = pathlib.Path(scratch) / "signature.bin"
                  body_file = pathlib.Path(scratch) / "body.bin"
                  signature_file.write_bytes(signature)
                  body_file.write_bytes(body)
                  subprocess.run(
                      ["openssl", "dgst", "-sha1", "-verify", str(public_key),
                       "-signature", str(signature_file), str(body_file)],
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  url = (f"https://github.com/{repository}/releases/download/{tag}/{payload.name}")
                  directory = pathlib.Path("feed") / (match["target"] + "-" + match["brand"]) / match["platform"]
                  directory.mkdir(parents=True, exist_ok=True)
                  for name in versions:
                      (directory / name).write_text(f"{match['version']}:{url}\n", encoding="utf-8")
                  written += 1
                  print(f"feed: {match['target']}/{match['brand']}/{match['platform']} -> {match['version']}")
          print(f"verified {written} payload(s)")
          PY

          cd feed
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          if git fetch -q --depth 1 origin updates; then
            git checkout -q -B updates FETCH_HEAD
          else
            git checkout -q --orphan updates
          fi
          git add -A
          git -c user.email=crossgram@users.noreply.github.com -c user.name=Crossgram \
            commit -q -m "updates: feed for crossgram-${RUN_NUMBER}"
          git push -q origin HEAD:updates
          echo "Published the update feed for crossgram-${RUN_NUMBER}."
